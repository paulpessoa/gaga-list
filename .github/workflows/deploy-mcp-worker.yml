name: MCP Worker

on:
  push:
    branches: [main]
    paths:
      - "gagalist-mcp-worker/**"
      - ".github/workflows/deploy-mcp-worker.yml"
  pull_request:
    paths:
      - "gagalist-mcp-worker/**"
      - ".github/workflows/deploy-mcp-worker.yml"
  workflow_dispatch:

concurrency:
  group: mcp-worker-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: gagalist-mcp-worker

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gagalist-mcp-worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gagalist-mcp-worker/package-lock.json
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: gagalist-mcp-worker
          command: deploy
      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://gagalist-mcp.paulmspessoa.workers.dev/)
          echo "GET / -> $code"
          test "$code" = "200"
